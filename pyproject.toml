[project]
name = "commitcraft"
version = "0.1.0"
description = "Fine-tuned Qwen2.5-Coder that turns a git diff into a Conventional Commit message, offline with Ollama."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
