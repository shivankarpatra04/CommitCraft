[project]
name = "commitcraft"
version = "0.1.0"
description = "Fine-tuned Qwen2.5-Coder that turns a git diff into a Conventional Commit message, offline with Ollama."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=2.6.0",
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "peft>=0.21.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "trl>=1.17.1",
    "wandb>=0.31.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
