name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t commitcraft-demo .
      - name: Check that the demo starts
        run: |
          docker run -d --name demo -p 7860:7860 commitcraft-demo
          curl --fail --silent --output /dev/null --retry 30 --retry-delay 2 --retry-all-errors http://localhost:7860/
      - name: Show the demo log on failure
        if: failure()
        run: docker logs demo
